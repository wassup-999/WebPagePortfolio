<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="600" height="700" role="img" aria-labelledby="title">
  <title id="title">Retrato provisional abstracto con silueta y marco técnico</title>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#171b2b"/>
      <stop offset="55%" stop-color="#10131e"/>
      <stop offset="100%" stop-color="#0a0c14"/>
    </linearGradient>
    <linearGradient id="figure" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#a89cff"/>
      <stop offset="55%" stop-color="#7361e8"/>
      <stop offset="100%" stop-color="#3b2f83"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#8b7bff" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#8b7bff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0v40" fill="none" stroke="#ffffff" stroke-opacity=".045"/>
    </pattern>
    <filter id="blur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="600" height="700" fill="url(#bg)"/>
  <rect width="600" height="700" fill="url(#grid)"/>
  <ellipse cx="300" cy="310" rx="230" ry="250" fill="url(#halo)"/>
  <circle cx="300" cy="290" r="188" fill="none" stroke="#8b7bff" stroke-opacity=".22"/>
  <circle cx="300" cy="290" r="152" fill="none" stroke="#45e0c8" stroke-opacity=".18" stroke-dasharray="2 10"/>

  <!-- Silueta -->
  <g>
    <circle cx="300" cy="282" r="92" fill="url(#figure)" opacity=".9"/>
    <circle cx="300" cy="282" r="92" fill="none" stroke="#ded9ff" stroke-opacity=".25" stroke-width="2"/>
    <path d="M168 540c0-79 59-143 132-143s132 64 132 143v72H168z" fill="url(#figure)" opacity=".85"/>
    <path d="M168 540c0-79 59-143 132-143s132 64 132 143" fill="none" stroke="#ded9ff" stroke-opacity=".22" stroke-width="2"/>
  </g>

  <!-- Marco técnico -->
  <g fill="none" stroke="#ffffff" stroke-opacity=".24">
    <path d="M36 96V36h60M504 36h60v60M564 604v60h-60M96 664H36v-60"/>
  </g>
  <g fill="#767e95" font-family="Consolas, monospace" font-size="13" letter-spacing="2">
    <text x="42" y="84">RETRATO / 01</text>
    <text x="414" y="630">PLACEHOLDER</text>
  </g>

  <g fill="#45e0c8">
    <circle cx="520" cy="290" r="3"/>
    <circle cx="82" cy="420" r="2.5" opacity=".7"/>
  </g>
  <g fill="#ffb86b">
    <circle cx="462" cy="470" r="2.5" opacity=".8"/>
  </g>

  <rect x="20" y="20" width="560" height="660" rx="18" fill="none" stroke="#ffffff" stroke-opacity=".12" stroke-dasharray="4 8"/>
</svg>
