<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title">
  <title id="title">Captura provisional de Skybound Arena: marcador final</title>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070918"/>
      <stop offset="55%" stop-color="#171334"/>
      <stop offset="100%" stop-color="#2a1a3d"/>
    </linearGradient>
    <linearGradient id="blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58c9ff"/>
      <stop offset="100%" stop-color="#45e0c8"/>
    </linearGradient>
    <linearGradient id="red" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff8a6b"/>
      <stop offset="100%" stop-color="#ffb86b"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <ellipse cx="800" cy="180" rx="420" ry="220" fill="#58c9ff" fill-opacity=".12" filter="url(#soft)"/>

  <g opacity=".2" stroke="#ffffff" stroke-width="1">
    <path d="M0 150h1600M0 300h1600M0 450h1600M0 600h1600M0 750h1600"/>
    <path d="M200 0v900M400 0v900M600 0v900M800 0v900M1000 0v900M1200 0v900M1400 0v900"/>
  </g>

  <!-- Cabecera -->
  <text x="800" y="112" fill="#f4f5fa" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="700" text-anchor="middle">Victoria del Equipo Azul</text>
  <text x="800" y="150" fill="#767e95" font-family="Consolas, monospace" font-size="14" letter-spacing="4" text-anchor="middle">SKYBOUND ARENA · PARTIDA FINALIZADA</text>

  <!-- Marcador -->
  <g>
    <rect x="300" y="190" width="1000" height="130" rx="14" fill="#080b1a" fill-opacity=".8" stroke="#58c9ff" stroke-opacity=".35" stroke-width="2"/>
    <text x="560" y="230" fill="#58c9ff" font-family="Consolas, monospace" font-size="13" letter-spacing="4" text-anchor="middle">EQUIPO AZUL</text>
    <text x="560" y="292" fill="#f4f5fa" font-family="Arial, Helvetica, sans-serif" font-size="50" font-weight="700" text-anchor="middle">250</text>
    <rect x="800" y="206" width="2" height="98" fill="#ffffff" fill-opacity=".12"/>
    <text x="1040" y="230" fill="#ff8a6b" font-family="Consolas, monospace" font-size="13" letter-spacing="4" text-anchor="middle">EQUIPO ROJO</text>
    <text x="1040" y="292" fill="#f4f5fa" font-family="Arial, Helvetica, sans-serif" font-size="50" font-weight="700" text-anchor="middle">185</text>
  </g>

  <!-- Tabla -->
  <g>
    <rect x="300" y="354" width="1000" height="380" rx="14" fill="#080b1a" fill-opacity=".72" stroke="#ffffff" stroke-opacity=".1"/>
    <g fill="#767e95" font-family="Consolas, monospace" font-size="11" letter-spacing="2">
      <text x="336" y="392">JUGADOR</text>
      <text x="720" y="392">PUNTOS</text>
      <text x="900" y="392">CAPTURAS</text>
      <text x="1080" y="392">BAJAS</text>
      <text x="1230" y="392">MUERTES</text>
    </g>
    <path d="M320 408h960" stroke="#ffffff" stroke-opacity=".1"/>

    <g font-family="Consolas, monospace" font-size="14" fill="#d6d9e7">
      <g>
        <rect x="320" y="420" width="960" height="46" fill="#58c9ff" fill-opacity=".08"/>
        <text x="336" y="449">TÚ</text>
        <text x="720" y="449">78</text>
        <text x="900" y="449">04</text>
        <text x="1080" y="449">11</text>
        <text x="1230" y="449">03</text>
      </g>
      <g>
        <text x="336" y="493">NOVA</text>
        <text x="720" y="493">64</text>
        <text x="900" y="493">03</text>
        <text x="1080" y="493">08</text>
        <text x="1230" y="493">05</text>
        <path d="M320 508h960" stroke="#ffffff" stroke-opacity=".07"/>
      </g>
      <g>
        <text x="336" y="541">RIFT</text>
        <text x="720" y="541">58</text>
        <text x="900" y="541">02</text>
        <text x="1080" y="541">09</text>
        <text x="1230" y="541">06</text>
        <path d="M320 556h960" stroke="#ffffff" stroke-opacity=".07"/>
      </g>
      <g>
        <text x="336" y="589">KITE</text>
        <text x="720" y="589">50</text>
        <text x="900" y="589">01</text>
        <text x="1080" y="589">06</text>
        <text x="1230" y="589">08</text>
        <path d="M320 604h960" stroke="#ffffff" stroke-opacity=".07"/>
      </g>
      <g opacity=".75">
        <text x="336" y="637">OZONE</text>
        <text x="720" y="637">61</text>
        <text x="900" y="637">03</text>
        <text x="1080" y="637">07</text>
        <text x="1230" y="637">04</text>
      </g>
    </g>
  </g>

  <!-- Botones -->
  <g>
    <rect x="610" y="774" width="180" height="52" rx="9" fill="#ffffff" fill-opacity=".04" stroke="#ffffff" stroke-opacity=".18"/>
    <text x="700" y="807" fill="#a8aec1" font-family="Consolas, monospace" font-size="13" letter-spacing="2" text-anchor="middle">SALIR</text>
    <rect x="810" y="774" width="220" height="52" rx="9" fill="url(#blue)"/>
    <text x="920" y="807" fill="#061019" font-family="Consolas, monospace" font-size="13" font-weight="700" letter-spacing="2" text-anchor="middle">JUGAR OTRA VEZ</text>
  </g>

  <g opacity=".8">
    <rect x="1304" y="52" width="242" height="36" rx="18" fill="#ffb86b" fill-opacity=".08" stroke="#ffb86b" stroke-opacity=".35"/>
    <text x="1425" y="76" fill="#ffb86b" font-family="Consolas, monospace" font-size="12" letter-spacing="2.5" text-anchor="middle">CAPTURA PROVISIONAL</text>
  </g>
</svg>
