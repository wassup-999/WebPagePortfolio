<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title">
  <title id="title">Captura provisional de Skybound Arena: islas y punto de captura</title>
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#080a20"/>
      <stop offset="50%" stop-color="#221540"/>
      <stop offset="100%" stop-color="#4a2749"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd7a1"/>
      <stop offset="100%" stop-color="#ff8a6b" stop-opacity=".15"/>
    </radialGradient>
    <linearGradient id="island" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a5672"/>
      <stop offset="100%" stop-color="#151d33"/>
    </linearGradient>
    <linearGradient id="vignette" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#03040a" stop-opacity=".6"/>
      <stop offset="30%" stop-color="#03040a" stop-opacity="0"/>
      <stop offset="100%" stop-color="#03040a" stop-opacity=".65"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- Luna y nubes -->
  <circle cx="420" cy="220" r="95" fill="url(#sun)"/>
  <circle cx="420" cy="220" r="95" fill="none" stroke="#ffd7a1" stroke-opacity=".25"/>
  <g fill="#ffd0b5" opacity=".14">
    <rect x="900" y="240" width="380" height="8" rx="4"/>
    <rect x="1020" y="266" width="220" height="6" rx="3"/>
    <rect x="180" y="380" width="280" height="7" rx="3"/>
  </g>

  <!-- Isla central -->
  <g>
    <path d="M480 520l320-70 340 70-60 78-230 34-310-40z" fill="url(#island)"/>
    <path d="M480 520l320-70 340 70-60 78-230 34-310-40z" fill="none" stroke="#9fc4e4" stroke-opacity=".28" stroke-width="2"/>
    <path d="M540 596l90 170 110-136 100 120 90-152 100 112" fill="#0b1120" stroke="#2e4762" stroke-opacity=".5"/>
    <g fill="#58c9ff" opacity=".7">
      <rect x="620" y="492" width="200" height="10"/>
      <rect x="690" y="466" width="120" height="26"/>
    </g>
    <g fill="#45e0c8" opacity=".35">
      <rect x="640" y="540" width="80" height="52"/>
      <rect x="740" y="540" width="56" height="40"/>
      <rect x="820" y="550" width="70" height="42"/>
    </g>
  </g>

  <!-- Islas laterales -->
  <g opacity=".75">
    <path d="M40 640l200-44 200 44-36 46-140 22-196-24z" fill="#1a2740"/>
    <path d="M80 690l60 100 70-82 56 66 54-96" fill="#0a1020"/>
    <path d="M1240 600l160-34 180 34-30 40-130 18-160-20z" fill="#221f3d"/>
    <path d="M1280 644l50 90 60-74 46 60 44-84" fill="#0c1024"/>
  </g>

  <!-- Punto de captura -->
  <g transform="translate(800 500)">
    <ellipse cx="0" cy="0" rx="150" ry="54" fill="none" stroke="#45e0c8" stroke-opacity=".65" stroke-width="4"/>
    <ellipse cx="0" cy="0" rx="108" ry="36" fill="none" stroke="#45e0c8" stroke-opacity=".25" stroke-width="2"/>
    <path d="M0 -150v120M-34 -112l34-38 34 38" fill="none" stroke="#45e0c8" stroke-width="4" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="12" fill="#45e0c8" fill-opacity=".3"/>
    <circle cx="0" cy="0" r="5" fill="#45e0c8"/>
    <text x="0" y="90" fill="#45e0c8" font-family="Consolas, monospace" font-size="14" letter-spacing="3" text-anchor="middle">PUNTO A</text>
  </g>

  <!-- Jugador planeando -->
  <g transform="translate(620 420)">
    <path d="M0 30c28-22 70-22 98 0-28 24-70 24-98 0z" fill="#f4f5fa"/>
    <path d="M6 30l-64-26 18-10 82 26z" fill="#8b7bff" fill-opacity=".85"/>
    <path d="M6 30l-64 26 18 10 82-26z" fill="#45e0c8" fill-opacity=".75"/>
    <circle cx="98" cy="30" r="10" fill="#ffb86b"/>
    <path d="M-6 50c30 8 62 6 90-4" fill="none" stroke="#ffffff" stroke-opacity=".3" stroke-width="2"/>
  </g>

  <!-- Rival -->
  <g transform="translate(1080 380) scale(.8)" opacity=".8">
    <path d="M0 30c28-22 70-22 98 0-28 24-70 24-98 0z" fill="#e8b7a8"/>
    <path d="M6 30l-64-26 18-10 82 26z" fill="#ff8a6b" fill-opacity=".85"/>
    <path d="M6 30l-64 26 18 10 82-26z" fill="#ffb86b" fill-opacity=".7"/>
    <circle cx="98" cy="30" r="10" fill="#8b7bff"/>
  </g>

  <!-- HUD -->
  <g font-family="Consolas, monospace" fill="#f4f5fa">
    <g>
      <rect x="54" y="48" width="330" height="86" rx="10" fill="#060814" fill-opacity=".74" stroke="#ffffff" stroke-opacity=".12"/>
      <text x="76" y="75" font-size="11" letter-spacing="3" fill="#767e95">EQUIPO AZUL</text>
      <rect x="76" y="86" width="200" height="9" rx="4" fill="#ffffff" fill-opacity=".1"/>
      <rect x="76" y="86" width="124" height="9" rx="4" fill="#58c9ff"/>
      <text x="76" y="120" font-size="11" letter-spacing="2" fill="#58c9ff">PUNTOS 0124</text>
      <text x="356" y="120" font-size="11" letter-spacing="2" fill="#767e95" text-anchor="end">2 / 3</text>
    </g>

    <g>
      <rect x="640" y="48" width="320" height="58" rx="9" fill="#060814" fill-opacity=".74" stroke="#ffffff" stroke-opacity=".12"/>
      <text x="800" y="72" font-size="11" letter-spacing="3" fill="#767e95" text-anchor="middle">TIEMPO DE PARTIDA</text>
      <text x="800" y="98" font-size="24" letter-spacing="2" fill="#f4f5fa" text-anchor="middle">03:42</text>
    </g>

    <g text-anchor="end">
      <rect x="1216" y="48" width="330" height="86" rx="10" fill="#060814" fill-opacity=".74" stroke="#ffffff" stroke-opacity=".12"/>
      <text x="1524" y="75" font-size="11" letter-spacing="3" fill="#767e95">EQUIPO ROJO</text>
      <rect x="1324" y="86" width="200" height="9" rx="4" fill="#ffffff" fill-opacity=".1"/>
      <rect x="1324" y="86" width="96" height="9" rx="4" fill="#ff8a6b"/>
      <text x="1524" y="120" font-size="11" letter-spacing="2" fill="#ff8a6b">PUNTOS 0096</text>
      <text x="1324" y="120" font-size="11" letter-spacing="2" fill="#767e95">1 / 3</text>
    </g>

    <g>
      <rect x="54" y="790" width="300" height="56" rx="8" fill="#060814" fill-opacity=".7" stroke="#ffffff" stroke-opacity=".1"/>
      <text x="76" y="814" font-size="10" letter-spacing="2" fill="#767e95">PLANEADOR</text>
      <text x="76" y="836" font-size="12" letter-spacing="1.5" fill="#a8aec1">ESPACIO · ELEVAR    SHIFT · PICAR</text>
    </g>
  </g>

  <rect width="1600" height="900" fill="url(#vignette)" pointer-events="none"/>
  <g opacity=".8">
    <rect x="1304" y="824" width="242" height="36" rx="18" fill="#ffb86b" fill-opacity=".08" stroke="#ffb86b" stroke-opacity=".35"/>
    <text x="1425" y="848" fill="#ffb86b" font-family="Consolas, monospace" font-size="12" letter-spacing="2.5" text-anchor="middle">CAPTURA PROVISIONAL</text>
  </g>
</svg>
