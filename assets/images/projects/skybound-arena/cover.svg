<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title">
  <title id="title">Portada provisional de Skybound Arena</title>
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090a20"/>
      <stop offset="45%" stop-color="#241440"/>
      <stop offset="78%" stop-color="#552a55"/>
      <stop offset="100%" stop-color="#a9564d"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd7a1"/>
      <stop offset="55%" stop-color="#ff9e6b"/>
      <stop offset="100%" stop-color="#ff6b6b" stop-opacity=".2"/>
    </radialGradient>
    <radialGradient id="haze" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffb86b" stop-opacity=".4"/>
      <stop offset="100%" stop-color="#ffb86b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="island1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#35506b"/>
      <stop offset="100%" stop-color="#171f38"/>
    </linearGradient>
    <linearGradient id="island2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6a4b7a"/>
      <stop offset="100%" stop-color="#2a1c3f"/>
    </linearGradient>
    <linearGradient id="fade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#05060c" stop-opacity="0"/>
      <stop offset="100%" stop-color="#05060c" stop-opacity=".88"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- Sol / luna -->
  <ellipse cx="1180" cy="660" rx="420" ry="300" fill="url(#haze)" filter="url(#soft)"/>
  <circle cx="1180" cy="650" r="150" fill="url(#sun)"/>
  <circle cx="1180" cy="650" r="150" fill="none" stroke="#ffd7a1" stroke-opacity=".35" stroke-width="2"/>

  <!-- Nubes -->
  <g fill="#ffd0b5" opacity=".18">
    <rect x="820" y="430" width="430" height="10" rx="5"/>
    <rect x="900" y="460" width="300" height="8" rx="4"/>
    <rect x="200" y="560" width="360" height="9" rx="4"/>
    <rect x="1300" y="360" width="220" height="8" rx="4"/>
  </g>

  <!-- Islas flotantes -->
  <g>
    <path d="M110 520l250-52 260 52-40 58-170 26-250-30z" fill="url(#island1)"/>
    <path d="M110 520l250-52 260 52-40 58-170 26-250-30z" fill="none" stroke="#8bb8d8" stroke-opacity=".25" stroke-width="2"/>
    <path d="M150 572l70 130 90-104 80 92 70-118" fill="#0e1627" stroke="#2c4560" stroke-opacity=".6"/>
    <g fill="#45e0c8" opacity=".8">
      <rect x="220" y="496" width="150" height="8"/>
      <rect x="300" y="476" width="70" height="20"/>
    </g>
    <g fill="#45e0c8" opacity=".4">
      <rect x="230" y="548" width="60" height="60"/>
      <rect x="290" y="548" width="40" height="40"/>
    </g>
  </g>

  <g>
    <path d="M980 330l210-46 220 46-36 50-150 24-214-28z" fill="url(#island2)"/>
    <path d="M980 330l210-46 220 46-36 50-150 24-214-28z" fill="none" stroke="#e7a3ff" stroke-opacity=".2" stroke-width="2"/>
    <path d="M1012 378l56 108 78-88 66 78 58-100" fill="#17132a" stroke="#4c3a66" stroke-opacity=".6"/>
    <g fill="#ffcf8f" opacity=".75">
      <rect x="1070" y="326" width="120" height="7"/>
      <rect x="1140" y="306" width="60" height="20"/>
    </g>
  </g>

  <g opacity=".8">
    <path d="M1280 570l110-26 130 26-20 30-90 14-130-16z" fill="#1a2037"/>
    <path d="M1300 600l40 80 50-66 44 58 38-72" fill="#0b1120"/>
  </g>

  <!-- Aeronaves -->
  <g>
    <g transform="translate(680 250) rotate(-8)">
      <path d="M0 20l70-16 50 16-50 14z" fill="#f4f5fa" fill-opacity=".85"/>
      <path d="M22 14l-24-22 12-4 34 20z" fill="#45e0c8" fill-opacity=".8"/>
      <path d="M22 26l-24 22 12 4 34-20z" fill="#8b7bff" fill-opacity=".8"/>
      <rect x="62" y="16" width="26" height="4" rx="2" fill="#ffb86b"/>
    </g>
    <path d="M560 280c60-22 120-30 180-20" fill="none" stroke="#ffffff" stroke-opacity=".16" stroke-width="2" stroke-dasharray="4 8"/>
    <g transform="translate(1340 440) rotate(6) scale(.7)">
      <path d="M0 20l70-16 50 16-50 14z" fill="#f4f5fa" fill-opacity=".7"/>
      <path d="M22 14l-24-22 12-4 34 20z" fill="#ffb86b" fill-opacity=".8"/>
      <path d="M22 26l-24 22 12 4 34-20z" fill="#8b7bff" fill-opacity=".7"/>
    </g>
  </g>

  <!-- Partículas -->
  <g fill="#ffcf8f">
    <circle cx="760" cy="640" r="2.5" opacity=".7"/>
    <circle cx="1420" cy="720" r="2" opacity=".5"/>
    <circle cx="300" cy="700" r="1.5" opacity=".4"/>
    <circle cx="1050" cy="780" r="2" opacity=".45"/>
  </g>

  <g>
    <rect x="1310" y="54" width="230" height="42" rx="21" fill="#ffb86b" fill-opacity=".1" stroke="#ffb86b" stroke-opacity=".45"/>
    <text x="1425" y="81" fill="#ffb86b" font-family="Consolas, monospace" font-size="14" letter-spacing="3" text-anchor="middle">PROVISIONAL</text>
  </g>

  <rect y="620" width="1600" height="280" fill="url(#fade)"/>
  <rect x="100" y="690" width="70" height="4" rx="2" fill="#58c9ff"/>
  <text x="100" y="780" fill="#f4f5fa" font-family="Arial, Helvetica, sans-serif" font-size="88" font-weight="700" letter-spacing="-3">Skybound Arena</text>
  <text x="102" y="822" fill="#a8aec1" font-family="Consolas, monospace" font-size="17" letter-spacing="4">MULTIJUGADOR · ARENA</text>
</svg>
