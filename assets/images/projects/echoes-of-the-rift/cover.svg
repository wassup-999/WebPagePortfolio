<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title">
  <title id="title">Portada provisional de Echoes of the Rift</title>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04090d"/>
      <stop offset="55%" stop-color="#071820"/>
      <stop offset="100%" stop-color="#0b2430"/>
    </linearGradient>
    <linearGradient id="rift" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff3d6"/>
      <stop offset="35%" stop-color="#ffb86b"/>
      <stop offset="100%" stop-color="#ff6b3d"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffb86b" stop-opacity=".55"/>
      <stop offset="60%" stop-color="#ff7a3d" stop-opacity=".16"/>
      <stop offset="100%" stop-color="#ff7a3d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d1c25"/>
      <stop offset="100%" stop-color="#050a0e"/>
    </linearGradient>
    <linearGradient id="fade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#04060a" stop-opacity="0"/>
      <stop offset="100%" stop-color="#04060a" stop-opacity=".9"/>
    </linearGradient>
    <filter id="blur" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="thin" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Persistencia de la sala -->
  <g fill="none" stroke="#7ea9b8" stroke-opacity=".14" stroke-width="2">
    <path d="M0 250h420l280 190v90"/>
    <path d="M0 700h360l340-230"/>
    <path d="M1600 210h-380l-300 230v120"/>
    <path d="M1600 760h-300l-360-250"/>
    <path d="M420 250v-90M1180 210V90M360 700v120M1300 760v100"/>
    <path d="M0 470h320M1280 470h320"/>
  </g>
  <g fill="none" stroke="#45e0c8" stroke-opacity=".18">
    <path d="M240 0v900M1360 0v900"/>
    <path d="M0 380h240M1360 380h240"/>
  </g>

  <!-- Pasarela -->
  <path d="M560 900l180-420h120l180 420z" fill="url(#floor)" stroke="#1e3540" stroke-width="2"/>
  <g stroke="#8b7bff" stroke-opacity=".25" stroke-width="3">
    <path d="M700 900l70-420M900 900l-70-420"/>
    <path d="M650 800h300M680 700h240M706 610h188"/>
  </g>

  <!-- Grieta -->
  <ellipse cx="1180" cy="470" rx="320" ry="330" fill="url(#glow)" filter="url(#blur)"/>
  <g filter="url(#thin)">
    <path d="M1188 60l-38 172 44 88-52 104 40 96-46 112 58 118-22 150h58l-6-156 52-122-44-98 48-108-46-96 40-118z" fill="url(#rift)" opacity=".9"/>
  </g>
  <path d="M1188 60l-38 172 44 88-52 104 40 96-46 112 58 118-22 150" fill="none" stroke="#fff3d6" stroke-width="3"/>
  <g stroke="#ffb86b" stroke-opacity=".55" stroke-width="2" fill="none">
    <path d="M1120 300l-80-42M1240 380l92-26M1100 540l-96 18M1230 650l88 46M1140 760l-70 52"/>
  </g>

  <!-- Silueta -->
  <g transform="translate(760 560)">
    <ellipse cx="34" cy="192" rx="60" ry="12" fill="#000" opacity=".6"/>
    <circle cx="34" cy="36" r="24" fill="#05090d" stroke="#ffb86b" stroke-opacity=".5" stroke-width="2"/>
    <path d="M8 156c0-60 12-96 26-96s26 36 26 96z" fill="#060b10" stroke="#2a4652" stroke-width="2"/>
    <path d="M18 68l-10 78M50 68l10 78" stroke="#060b10" stroke-width="12" stroke-linecap="round"/>
    <path d="M22 156l-8 34M46 156l8 34" stroke="#060b10" stroke-width="14" stroke-linecap="round"/>
    <rect x="20" y="96" width="28" height="8" rx="3" fill="#ffb86b" fill-opacity=".6"/>
  </g>

  <!-- Detalles -->
  <g fill="#ffb86b">
    <circle cx="1060" cy="260" r="2.5" opacity=".8"/>
    <circle cx="1320" cy="620" r="2" opacity=".6"/>
    <circle cx="980" cy="700" r="1.5" opacity=".5"/>
    <circle cx="1400" cy="340" r="1.5" opacity=".4"/>
  </g>

  <g>
    <rect x="1310" y="54" width="230" height="42" rx="21" fill="#ffb86b" fill-opacity=".1" stroke="#ffb86b" stroke-opacity=".45"/>
    <text x="1425" y="81" fill="#ffb86b" font-family="Consolas, monospace" font-size="14" letter-spacing="3" text-anchor="middle">PROVISIONAL</text>
  </g>

  <rect y="620" width="1600" height="280" fill="url(#fade)"/>
  <rect x="100" y="690" width="70" height="4" rx="2" fill="#ffb86b"/>
  <text x="100" y="778" fill="#f4f5fa" font-family="Arial, Helvetica, sans-serif" font-size="82" font-weight="700" letter-spacing="-3">Echoes of the Rift</text>
  <text x="102" y="820" fill="#a8aec1" font-family="Consolas, monospace" font-size="17" letter-spacing="4">ACCIÓN FPS · DEMO TÉCNICA</text>
</svg>
