<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title">
  <title id="title">Captura provisional de Echoes of the Rift: combate</title>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060d12"/>
      <stop offset="60%" stop-color="#0a1d27"/>
      <stop offset="100%" stop-color="#132c37"/>
    </linearGradient>
    <radialGradient id="flash" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff1d6"/>
      <stop offset="35%" stop-color="#ffb86b"/>
      <stop offset="100%" stop-color="#ff7a3d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hurt" cx="50%" cy="50%" r="70%">
      <stop offset="60%" stop-color="#ff3b3b" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ff3b3b" stop-opacity=".35"/>
    </radialGradient>
    <linearGradient id="vignette" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020406" stop-opacity=".7"/>
      <stop offset="30%" stop-color="#020406" stop-opacity="0"/>
      <stop offset="100%" stop-color="#020406" stop-opacity=".55"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Muros -->
  <g fill="#0a1820" stroke="#27505e" stroke-opacity=".45" stroke-width="2">
    <path d="M0 0h1600v170H0z"/>
    <path d="M0 640h1600v260H0z"/>
    <path d="M0 170l420 150v320L0 760z"/>
    <path d="M1600 170l-420 150v320l420 120z"/>
  </g>
  <g fill="none" stroke="#5f8b9b" stroke-opacity=".16">
    <path d="M0 280h430M0 400h400M0 520h430M1600 280h-430M1600 400h-400M1600 520h-430"/>
    <path d="M210 170v430M1390 170v430"/>
    <path d="M460 320v280M1140 320v280"/>
  </g>

  <!-- Zona central -->
  <rect x="460" y="320" width="680" height="300" fill="#081218" stroke="#2c5361" stroke-width="2"/>
  <g stroke="#45e0c8" stroke-opacity=".22">
    <path d="M460 420h680M460 520h680M580 320v300M760 320v300M940 320v300M1120 320v300"/>
  </g>

  <!-- Enemigos -->
  <g fill="#03070a" stroke="#ff8a5c" stroke-opacity=".55" stroke-width="2">
    <g transform="translate(660 360)">
      <circle cx="30" cy="20" r="17"/>
      <path d="M6 120c0-48 10-78 24-78s24 30 24 78z"/>
      <path d="M12 58l-18 52M48 58l18 52" stroke-width="9" stroke-linecap="round"/>
      <path d="M18 120l-6 40M42 120l6 40" stroke-width="10" stroke-linecap="round"/>
      <path d="M22 74h16" stroke="#ffb86b" stroke-opacity=".9"/>
    </g>
    <g transform="translate(890 390) scale(.9)">
      <circle cx="30" cy="20" r="17"/>
      <path d="M6 120c0-48 10-78 24-78s24 30 24 78z"/>
      <path d="M12 58l-18 52M48 58l18 52" stroke-width="9" stroke-linecap="round"/>
      <path d="M18 120l-6 40M42 120l6 40" stroke-width="10" stroke-linecap="round"/>
      <path d="M22 74h16" stroke="#ffb86b" stroke-opacity=".7"/>
    </g>
  </g>

  <!-- Disparo -->
  <circle cx="690" cy="420" r="62" fill="url(#flash)" filter="url(#glow)"/>
  <path d="M700 420l260-30" stroke="#ffe3b8" stroke-opacity=".7" stroke-width="3"/>
  <g fill="#ffb86b">
    <circle cx="700" cy="420" r="4"/>
    <circle cx="742" cy="414" r="2.5" opacity=".7"/>
    <circle cx="774" cy="410" r="2" opacity=".5"/>
  </g>

  <!-- Arma en primer plano -->
  <g fill="#0a1116" stroke="#3b5a66" stroke-width="2">
    <path d="M1090 900l40-180 120-80 180 20 80 90-40 150z"/>
    <path d="M1180 720l70 120 60-26-46-118z" fill="#111c22"/>
    <rect x="1320" y="700" width="70" height="26" rx="4" fill="#111c22"/>
    <path d="M1300 760l60 4" stroke="#ffb86b" stroke-opacity=".5" stroke-width="3"/>
  </g>

  <!-- Mira -->
  <g stroke="#f4f5fa" stroke-opacity=".85" stroke-width="2">
    <path d="M800 425v-20M800 475v20M775 450h-20M825 450h20"/>
    <circle cx="800" cy="450" r="3" fill="#ffb86b" stroke="none"/>
  </g>

  <!-- HUD -->
  <g font-family="Consolas, monospace" fill="#f4f5fa">
    <g>
      <rect x="54" y="50" width="300" height="74" rx="8" fill="#04080b" fill-opacity=".72" stroke="#ffffff" stroke-opacity=".12"/>
      <text x="76" y="78" font-size="11" letter-spacing="3" fill="#ffb86b">HOSTILES</text>
      <text x="76" y="106" font-size="24">02</text>
      <text x="140" y="106" font-size="11" letter-spacing="2" fill="#767e95">EN COMBATE</text>
    </g>
    <g>
      <rect x="54" y="786" width="290" height="64" rx="8" fill="#04080b" fill-opacity=".7" stroke="#ffffff" stroke-opacity=".12"/>
      <text x="76" y="812" font-size="11" letter-spacing="2" fill="#ff8a6b">ALERTA DE DAÑO</text>
      <rect x="76" y="822" width="190" height="7" rx="3" fill="#ffffff" fill-opacity=".1"/>
      <rect x="76" y="822" width="132" height="7" rx="3" fill="#ff5f5f"/>
    </g>
    <g text-anchor="end">
      <rect x="1300" y="770" width="246" height="80" rx="8" fill="#04080b" fill-opacity=".7" stroke="#ffffff" stroke-opacity=".12"/>
      <text x="1524" y="798" font-size="11" letter-spacing="2" fill="#767e95">RIFLE · CARGADOR</text>
      <text x="1524" y="832" font-size="34">19 <tspan font-size="16" fill="#767e95">/ 96</tspan></text>
    </g>
  </g>

  <rect width="1600" height="900" fill="url(#hurt)" pointer-events="none"/>
  <rect width="1600" height="900" fill="url(#vignette)" pointer-events="none"/>
  <g opacity=".8">
    <rect x="1304" y="52" width="242" height="36" rx="18" fill="#ffb86b" fill-opacity=".08" stroke="#ffb86b" stroke-opacity=".35"/>
    <text x="1425" y="76" fill="#ffb86b" font-family="Consolas, monospace" font-size="12" letter-spacing="2.5" text-anchor="middle">CAPTURA PROVISIONAL</text>
  </g>
</svg>
