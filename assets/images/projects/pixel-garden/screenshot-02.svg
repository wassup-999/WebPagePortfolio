<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title" shape-rendering="crispEdges">
  <title id="title">Captura provisional de Pixel Garden: pantalla de nivel completado</title>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081a12"/>
      <stop offset="100%" stop-color="#173c29"/>
    </linearGradient>
    <linearGradient id="panel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c3a29"/>
      <stop offset="100%" stop-color="#102418"/>
    </linearGradient>
    <linearGradient id="button" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7be8b1"/>
      <stop offset="100%" stop-color="#38b978"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Fondo de tablero atenuado -->
  <g opacity=".22">
    <g stroke="#5fd99a" stroke-width="2">
      <path d="M0 150h1600M0 300h1600M0 450h1600M0 600h1600M0 750h1600"/>
      <path d="M200 0v900M400 0v900M600 0v900M800 0v900M1000 0v900M1200 0v900M1400 0v900"/>
    </g>
    <g fill="#5fd99a">
      <rect x="280" y="360" width="10" height="70"/>
      <rect x="248" y="340" width="34" height="14"/>
      <rect x="290" y="370" width="34" height="14"/>
      <rect x="1220" y="480" width="10" height="70"/>
      <rect x="1188" y="460" width="34" height="14"/>
      <rect x="1230" y="490" width="34" height="14"/>
    </g>
  </g>
  <rect width="1600" height="900" fill="#050c08" opacity=".55"/>

  <!-- Panel -->
  <g>
    <rect x="410" y="210" width="780" height="480" fill="#050c08" opacity=".5"/>
    <rect x="420" y="200" width="780" height="480" fill="url(#panel)" stroke="#5fd99a" stroke-opacity=".5" stroke-width="3"/>
    <g fill="#5fd99a">
      <rect x="420" y="200" width="26" height="8"/>
      <rect x="420" y="200" width="8" height="26"/>
      <rect x="1174" y="200" width="26" height="8"/>
      <rect x="1192" y="200" width="8" height="26"/>
      <rect x="420" y="672" width="26" height="8"/>
      <rect x="420" y="654" width="8" height="26"/>
      <rect x="1174" y="672" width="26" height="8"/>
      <rect x="1192" y="654" width="8" height="26"/>
    </g>

    <text x="810" y="286" fill="#5fd99a" font-family="Consolas, monospace" font-size="16" letter-spacing="5" text-anchor="middle">NIVEL COMPLETADO</text>
    <text x="810" y="356" fill="#f4f5fa" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="700" text-anchor="middle">¡Jardín en flor!</text>
    <text x="810" y="396" fill="#a8aec1" font-family="Consolas, monospace" font-size="15" letter-spacing="1" text-anchor="middle">Todas las plantas han florecido.</text>

    <!-- Estrellas -->
    <g fill="#ffcf8f">
      <rect x="686" y="434" width="56" height="12"/>
      <rect x="698" y="422" width="32" height="12"/>
      <rect x="706" y="446" width="16" height="12"/>
      <rect x="772" y="434" width="56" height="12"/>
      <rect x="784" y="422" width="32" height="12"/>
      <rect x="792" y="446" width="16" height="12"/>
      <rect x="858" y="434" width="56" height="12"/>
      <rect x="870" y="422" width="32" height="12"/>
      <rect x="878" y="446" width="16" height="12"/>
    </g>

    <!-- Estadísticas -->
    <g font-family="Consolas, monospace">
      <text x="560" y="534" font-size="12" letter-spacing="2" fill="#767e95">TURNOS USADOS</text>
      <text x="560" y="570" font-size="26" fill="#f4f5fa">07 / 12</text>
      <text x="800" y="534" font-size="12" letter-spacing="2" fill="#767e95">PLANTAS</text>
      <text x="800" y="570" font-size="26" fill="#f4f5fa">05 / 05</text>
      <text x="1040" y="534" font-size="12" letter-spacing="2" fill="#767e95">AGUA RESTANTE</text>
      <text x="1040" y="570" font-size="26" fill="#58c9ff">04</text>
    </g>

    <!-- Botones -->
    <g>
      <rect x="500" y="612" width="260" height="52" fill="#0a1810" stroke="#5fd99a" stroke-opacity=".45"/>
      <text x="630" y="645" fill="#a8aec1" font-family="Consolas, monospace" font-size="14" letter-spacing="2" text-anchor="middle">REPETIR</text>

      <rect x="790" y="612" width="300" height="52" fill="url(#button)"/>
      <text x="940" y="645" fill="#06120b" font-family="Consolas, monospace" font-size="14" font-weight="700" letter-spacing="2" text-anchor="middle">SIGUIENTE NIVEL</text>
    </g>
  </g>

  <g opacity=".8">
    <rect x="1304" y="824" width="242" height="36" rx="18" fill="#ffb86b" fill-opacity=".08" stroke="#ffb86b" stroke-opacity=".35"/>
    <text x="1425" y="848" fill="#ffb86b" font-family="Consolas, monospace" font-size="12" letter-spacing="2.5" text-anchor="middle">CAPTURA PROVISIONAL</text>
  </g>
</svg>
