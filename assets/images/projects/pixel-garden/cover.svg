<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title" shape-rendering="crispEdges">
  <title id="title">Portada provisional de Pixel Garden</title>
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a2018"/>
      <stop offset="55%" stop-color="#123527"/>
      <stop offset="100%" stop-color="#1b4a33"/>
    </linearGradient>
    <linearGradient id="fade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#050c08" stop-opacity="0"/>
      <stop offset="100%" stop-color="#050c08" stop-opacity=".88"/>
    </linearGradient>
    <linearGradient id="soil" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2c4a33"/>
      <stop offset="100%" stop-color="#16281c"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- Sol -->
  <circle cx="1290" cy="210" r="110" fill="#ffcf8f" opacity=".18" filter="url(#glow)"/>
  <g fill="#ffcf8f">
    <rect x="1210" y="150" width="160" height="120"/>
    <rect x="1190" y="170" width="200" height="80"/>
    <rect x="1230" y="130" width="120" height="160"/>
  </g>
  <g fill="#ffb86b" opacity=".5">
    <rect x="1230" y="250" width="120" height="20"/>
  </g>

  <!-- Colinas pixeladas -->
  <g fill="#16362a">
    <rect x="0" y="330" width="160" height="60"/>
    <rect x="160" y="300" width="120" height="90"/>
    <rect x="280" y="340" width="180" height="50"/>
    <rect x="960" y="340" width="160" height="50"/>
    <rect x="1120" y="310" width="140" height="80"/>
    <rect x="1260" y="350" width="180" height="40"/>
  </g>

  <!-- Suelo / tablero -->
  <rect x="0" y="420" width="1600" height="480" fill="url(#soil)"/>
  <g stroke="#3f6647" stroke-opacity=".4" stroke-width="2">
    <path d="M0 420h1600M0 520h1600M0 620h1600M0 720h1600M0 820h1600"/>
    <path d="M100 420v480M300 420v480M500 420v480M700 420v480M900 420v480M1100 420v480M1300 420v480M1500 420v480"/>
  </g>

  <!-- Parcelas destacadas -->
  <g>
    <rect x="500" y="520" width="200" height="100" fill="#284b34"/>
    <rect x="900" y="620" width="200" height="100" fill="#284b34"/>
    <rect x="300" y="720" width="200" height="100" fill="#284b34"/>
  </g>

  <!-- Plantas pixel art -->
  <g>
    <!-- Planta 1 -->
    <g fill="#5fd99a">
      <rect x="570" y="570" width="12" height="40"/>
      <rect x="546" y="556" width="30" height="14"/>
      <rect x="576" y="576" width="30" height="14"/>
      <rect x="558" y="540" width="12" height="16"/>
    </g>
    <g fill="#ffcf8f">
      <rect x="546" y="528" width="36" height="12"/>
      <rect x="552" y="516" width="24" height="12"/>
      <rect x="558" y="528" width="12" height="12" fill="#ffb86b"/>
    </g>

    <!-- Planta 2 -->
    <g fill="#7be8b1">
      <rect x="970" y="670" width="12" height="40"/>
      <rect x="946" y="656" width="30" height="14"/>
      <rect x="976" y="676" width="30" height="14"/>
    </g>
    <g fill="#f08bd4">
      <rect x="946" y="628" width="36" height="12"/>
      <rect x="952" y="616" width="24" height="12"/>
      <rect x="958" y="628" width="12" height="12" fill="#ffcf8f"/>
    </g>

    <!-- Planta 3 -->
    <g fill="#5fd99a">
      <rect x="370" y="770" width="12" height="40"/>
      <rect x="346" y="756" width="30" height="14"/>
      <rect x="376" y="776" width="30" height="14"/>
    </g>
    <g fill="#58c9ff">
      <rect x="346" y="728" width="36" height="12"/>
      <rect x="352" y="716" width="24" height="12"/>
    </g>
  </g>

  <!-- Cubos decorativos -->
  <g fill="#8b7bff" opacity=".55">
    <rect x="140" y="240" width="16" height="16"/>
    <rect x="156" y="224" width="16" height="16"/>
    <rect x="172" y="240" width="16" height="16"/>
  </g>

  <!-- Badge provisional -->
  <g>
    <rect x="1310" y="54" width="230" height="42" rx="21" fill="#ffb86b" fill-opacity=".1" stroke="#ffb86b" stroke-opacity=".45"/>
    <text x="1425" y="81" fill="#ffb86b" font-family="Consolas, monospace" font-size="14" letter-spacing="3" text-anchor="middle">PROVISIONAL</text>
  </g>

  <rect y="620" width="1600" height="280" fill="url(#fade)"/>
  <rect x="100" y="692" width="70" height="6" fill="#5fd99a"/>
  <text x="100" y="780" fill="#f4f5fa" font-family="Consolas, monospace" font-size="84" font-weight="700" letter-spacing="-2">PIXEL GARDEN</text>
  <text x="102" y="824" fill="#a8aec1" font-family="Consolas, monospace" font-size="17" letter-spacing="4">PUZLE · PROTOTIPO JUGABLE</text>
</svg>
