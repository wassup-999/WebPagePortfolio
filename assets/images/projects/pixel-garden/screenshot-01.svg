<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title" shape-rendering="crispEdges">
  <title id="title">Captura provisional de Pixel Garden: tablero de puzle</title>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081a12"/>
      <stop offset="100%" stop-color="#123323"/>
    </linearGradient>
    <linearGradient id="board" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a2a"/>
      <stop offset="100%" stop-color="#142a1d"/>
