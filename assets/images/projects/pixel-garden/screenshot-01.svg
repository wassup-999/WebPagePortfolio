  <!-- Panel inferior -->
  <g font-family="Consolas, monospace">
    <rect x="290" y="800" width="1020" height="54" rx="8" fill="#07120c" fill-opacity=".82" stroke="#5fd99a" stroke-opacity=".2"/>
    <text x="314" y="824" font-size="11" letter-spacing="2" fill="#767e95">ACCIONES</text>
    <text x="314" y="844" font-size="13" fill="#a8aec1">CLIC · SELECCIONAR    R · ROTAR    ESPACIO · REGAR</text>
    <text x="1286" y="834" font-size="12" letter-spacing="2" fill="#5fd99a" text-anchor="end">TURNO 07 / 12</text>
  </g>

  <g opacity=".8">
    <rect x="1304" y="52" width="242" height="36" rx="18" fill="#ffb86b" fill-opacity=".08" stroke="#ffb86b" stroke-opacity=".35"/>
    <text x="1425" y="76" fill="#ffb86b" font-family="Consolas, monospace" font-size="12" letter-spacing="2.5" text-anchor="middle">CAPTURA PROVISIONAL</text>
