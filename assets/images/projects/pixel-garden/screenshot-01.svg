  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <g opacity=".35" stroke="#5fd99a" stroke-width="1">
    <path d="M0 100h1600M0 200h1600M0 300h1600M0 400h1600M0 500h1600M0 600h1600M0 700h1600M0 800h1600"/>
    <path d="M100 0v900M200 0v900M300 0v900M400 0v900M500 0v900M600 0v900M700 0v900M800 0v900M900 0v900M1000 0v900M1100 0v900M1200 0v900M1300 0v900M1400 0v900M1500 0v900"/>
  </g>

  <!-- HUD superior -->
  <g font-family="Consolas, monospace" fill="#f4f5fa">
    <rect x="60" y="44" width="1480" height="72" rx="10" fill="#07120c" fill-opacity=".82" stroke="#5fd99a" stroke-opacity=".22"/>
    <text x="88" y="76" font-size="11" letter-spacing="3" fill="#767e95">NIVEL</text>
    <text x="88" y="102" font-size="22" fill="#f4f5fa">03 / 12</text>
    <text x="300" y="76" font-size="11" letter-spacing="3" fill="#767e95">TURNOS</text>
    <text x="300" y="102" font-size="22" fill="#ffcf8f">07</text>
    <text x="510" y="76" font-size="11" letter-spacing="3" fill="#767e95">AGUA</text>
    <text x="510" y="102" font-size="22" fill="#58c9ff">04</text>
    <text x="720" y="76" font-size="11" letter-spacing="3" fill="#767e95">ABONO</text>
    <text x="720" y="102" font-size="22" fill="#5fd99a">02</text>
    <text x="1484" y="76" font-size="11" letter-spacing="3" fill="#767e95" text-anchor="end">OBJETIVO</text>
    <text x="1484" y="102" font-size="15" fill="#a8aec1" text-anchor="end">HAZ FLORECER 5 PLANTAS</text>
  </g>

