      <rect x="562" y="386" width="28" height="12"/>
      <rect x="594" y="404" width="28" height="12"/>
    </g>
    <g fill="#f08bd4">
      <rect x="562" y="358" width="38" height="10"/>
      <rect x="568" y="346" width="26" height="12"/>
    </g>
    <g fill="#58c9ff">
      <rect x="1210" y="242" width="12" height="48"/>
      <rect x="1186" y="228" width="30" height="12"/>
      <rect x="1218" y="248" width="30" height="12"/>
    </g>
    <g fill="#ffb86b">
      <rect x="1186" y="202" width="40" height="10"/>
      <rect x="1192" y="190" width="28" height="12"/>
    </g>

    <!-- Cursor -->
    <rect x="704" y="334" width="192" height="140" fill="none" stroke="#ffcf8f" stroke-width="4"/>
    <g fill="#ffcf8f">
      <rect x="876" y="334" width="20" height="6"/>
      <rect x="876" y="334" width="6" height="20"/>
    </g>

    <!-- Flecha de rotación -->
    <g fill="#ffcf8f">
      <rect x="760" y="300" width="80" height="8"/>
      <rect x="832" y="292" width="8" height="24"/>
      <rect x="840" y="284" width="8" height="24"/>
