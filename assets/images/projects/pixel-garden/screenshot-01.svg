    <g fill="#5fd99a">
      <rect x="376" y="246" width="10" height="52"/>
      <rect x="352" y="232" width="26" height="12"/>
      <rect x="384" y="252" width="26" height="12"/>
      <rect x="890" y="670" width="10" height="52"/>
      <rect x="866" y="656" width="26" height="12"/>
      <rect x="898" y="676" width="26" height="12"/>
