<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title">
  <title id="title">Captura provisional de Nebula Drift: sala de plataformas</title>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d20"/>
      <stop offset="60%" stop-color="#161438"/>
      <stop offset="100%" stop-color="#241a4a"/>
    </linearGradient>
    <radialGradient id="planet" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#9c8cff"/>
      <stop offset="100%" stop-color="#2b1e5e"/>
    </radialGradient>
    <linearGradient id="platform" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2b3358"/>
      <stop offset="100%" stop-color="#11162b"/>
    </linearGradient>
    <linearGradient id="hud" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#45e0c8"/>
      <stop offset="100%" stop-color="#8b7bff"/>
    </linearGradient>
    <linearGradient id="vignette" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#05060c" stop-opacity=".55"/>
      <stop offset="22%" stop-color="#05060c" stop-opacity="0"/>
      <stop offset="78%" stop-color="#05060c" stop-opacity="0"/>
      <stop offset="100%" stop-color="#05060c" stop-opacity=".65"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Fondo -->
  <circle cx="330" cy="210" r="180" fill="url(#planet)" opacity=".85"/>
  <ellipse cx="330" cy="210" rx="270" ry="52" fill="none" stroke="#b9afff" stroke-opacity=".3" stroke-width="3" transform="rotate(-16 330 210)"/>
  <g fill="#ffffff">
    <circle cx="880" cy="110" r="2" opacity=".6"/>
    <circle cx="1120" cy="200" r="1.5" opacity=".5"/>
    <circle cx="1440" cy="120" r="2.5" opacity=".7"/>
    <circle cx="1240" cy="330" r="1.5" opacity=".45"/>
    <circle cx="690" cy="260" r="2" opacity=".4"/>
    <circle cx="1510" cy="420" r="1.5" opacity=".4"/>
  </g>

  <!-- Estructura de fondo -->
  <g stroke="#ffffff" stroke-opacity=".07" fill="none">
    <path d="M980 0v900M1180 0v900M1380 0v900"/>
    <path d="M900 680h500M900 540h700M900 400h400"/>
  </g>

  <!-- Plataformas -->
  <g>
    <rect x="120" y="690" width="470" height="34" rx="8" fill="url(#platform)" stroke="#47527f" stroke-width="2"/>
    <rect x="126" y="690" width="458" height="5" rx="2.5" fill="#8b7bff" opacity=".75"/>
    <rect x="700" y="560" width="330" height="30" rx="8" fill="url(#platform)" stroke="#47527f" stroke-width="2"/>
    <rect x="706" y="560" width="318" height="5" rx="2.5" fill="#45e0c8" opacity=".6"/>
    <rect x="1140" y="650" width="330" height="34" rx="8" fill="url(#platform)" stroke="#47527f" stroke-width="2"/>
    <rect x="1146" y="650" width="318" height="5" rx="2.5" fill="#ffb86b" opacity=".55"/>
    <rect x="470" y="440" width="180" height="24" rx="7" fill="#1a2038" stroke="#3c466e" stroke-width="2"/>
    <rect x="916" y="760" width="200" height="24" rx="7" fill="#1a2038" stroke="#3c466e" stroke-width="2"/>
  </g>

  <!-- Jugador -->
  <g transform="translate(770 452)">
    <ellipse cx="26" cy="112" rx="34" ry="8" fill="#000" opacity=".4"/>
    <circle cx="26" cy="24" r="19" fill="#0b0f1e" stroke="#d8d1ff" stroke-width="2.5"/>
    <path d="M10 20a16 16 0 0 1 32 0 16 16 0 0 1-32 0z" fill="#45e0c8" fill-opacity=".28"/>
    <rect x="9" y="46" width="34" height="42" rx="8" fill="#e8e6ff"/>
    <path d="M12 54l-16 24M40 54l16 22" stroke="#e8e6ff" stroke-width="7" stroke-linecap="round"/>
    <path d="M16 86l-4 30M36 86l5 30" stroke="#b9afff" stroke-width="8" stroke-linecap="round"/>
    <rect x="13" y="58" width="26" height="9" rx="3" fill="#8b7bff"/>
  </g>

  <!-- Criatura -->
  <g transform="translate(1210 606)">
    <ellipse cx="24" cy="34" rx="24" ry="10" fill="#000" opacity=".35"/>
    <path d="M6 34a18 18 0 0 1 36 0v8H6z" fill="#ffb86b" fill-opacity=".85"/>
    <circle cx="16" cy="30" r="3" fill="#0a0a12"/>
    <circle cx="32" cy="30" r="3" fill="#0a0a12"/>
  </g>

  <!-- Partículas -->
  <g fill="#45e0c8">
    <circle cx="830" cy="520" r="2.5" opacity=".8"/>
    <circle cx="870" cy="480" r="1.5" opacity=".5"/>
    <circle cx="740" cy="505" r="1.5" opacity=".4"/>
    <circle cx="1080" cy="530" r="2" opacity=".5"/>
  </g>

  <!-- HUD -->
  <g font-family="Consolas, monospace" fill="#f4f5fa">
    <g>
      <rect x="56" y="52" width="300" height="86" rx="10" fill="#080b16" fill-opacity=".72" stroke="#ffffff" stroke-opacity=".12"/>
      <text x="78" y="82" font-size="13" letter-spacing="3" fill="#a8aec1">TRAJE · INTEGRIDAD</text>
      <rect x="78" y="96" width="252" height="8" rx="4" fill="#ffffff" fill-opacity=".1"/>
      <rect x="78" y="96" width="212" height="8" rx="4" fill="url(#hud)"/>
      <text x="78" y="126" font-size="12" letter-spacing="2" fill="#45e0c8">ENERGÍA 84%</text>
    </g>
    <g text-anchor="end">
      <text x="1544" y="74" font-size="13" letter-spacing="3" fill="#a8aec1">SECTOR 02</text>
      <text x="1544" y="100" font-size="22" letter-spacing="2" fill="#f4f5fa">NEBULA DRIFT</text>
      <text x="1544" y="126" font-size="12" letter-spacing="2" fill="#ffb86b">CHECKPOINT ACTIVO</text>
    </g>
    <g>
      <rect x="56" y="800" width="250" height="52" rx="9" fill="#080b16" fill-opacity=".7" stroke="#ffffff" stroke-opacity=".1"/>
      <text x="76" y="822" font-size="11" letter-spacing="2" fill="#767e95">MOVIMIENTO</text>
      <text x="76" y="842" font-size="13" letter-spacing="1.5" fill="#a8aec1">A · D    ESPACIO · SALTO</text>
    </g>
  </g>

  <rect width="1600" height="900" fill="url(#vignette)" pointer-events="none"/>

  <g opacity=".8">
    <rect x="1304" y="824" width="242" height="36" rx="18" fill="#ffb86b" fill-opacity=".08" stroke="#ffb86b" stroke-opacity=".35"/>
    <text x="1425" y="848" fill="#ffb86b" font-family="Consolas, monospace" font-size="12" letter-spacing="2.5" text-anchor="middle">CAPTURA PROVISIONAL</text>
  </g>
</svg>
