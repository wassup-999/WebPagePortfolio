<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title">
  <title id="title">Captura provisional de Nebula Drift: zona de baja gravedad</title>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081018"/>
      <stop offset="55%" stop-color="#0e1c33"/>
      <stop offset="100%" stop-color="#1b1650"/>
    </linearGradient>
    <linearGradient id="beam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#45e0c8" stop-opacity=".28"/>
      <stop offset="100%" stop-color="#45e0c8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="platform" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2b3358"/>
      <stop offset="100%" stop-color="#11162b"/>
    </linearGradient>
    <linearGradient id="energy" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b7bff"/>
      <stop offset="100%" stop-color="#45e0c8"/>
    </linearGradient>
    <linearGradient id="vignette" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#05060c" stop-opacity=".6"/>
      <stop offset="25%" stop-color="#05060c" stop-opacity="0"/>
      <stop offset="100%" stop-color="#05060c" stop-opacity=".6"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Cámara vertical -->
  <g fill="none" stroke="#ffffff" stroke-opacity=".07">
    <rect x="180" y="80" width="1240" height="740" rx="20"/>
    <path d="M560 80v740M1040 80v740M180 320h1240M180 580h1240"/>
  </g>
  <path d="M760 80v740" stroke="#45e0c8" stroke-opacity=".12" stroke-width="120" fill="none"/>
  <rect x="700" y="80" width="120" height="740" fill="url(#beam)" opacity=".5"/>

  <!-- Estrellas -->
  <g fill="#ffffff">
    <circle cx="310" cy="170" r="2" opacity=".6"/>
    <circle cx="1280" cy="200" r="2.5" opacity=".55"/>
    <circle cx="1460" cy="700" r="1.5" opacity=".4"/>
    <circle cx="140" cy="520" r="2" opacity=".4"/>
    <circle cx="960" cy="140" r="1.5" opacity=".5"/>
  </g>

  <!-- Plataformas -->
  <g>
    <rect x="220" y="760" width="380" height="30" rx="8" fill="url(#platform)" stroke="#47527f" stroke-width="2"/>
    <rect x="226" y="760" width="368" height="5" rx="2.5" fill="#8b7bff" opacity=".7"/>
    <rect x="1010" y="520" width="300" height="24" rx="7" fill="#1a2038" stroke="#3c466e" stroke-width="2"/>
    <rect x="1060" y="300" width="220" height="20" rx="6" fill="#1a2038" stroke="#3c466e" stroke-width="2"/>
    <rect x="480" y="430" width="180" height="20" rx="6" fill="#1a2038" stroke="#3c466e" stroke-width="2"/>
  </g>

  <!-- Flechas de gravedad -->
  <g fill="none" stroke="#45e0c8" stroke-opacity=".55" stroke-width="3" stroke-linecap="round">
    <path d="M820 700l0-70M796 654l24-24 24 24"/>
    <path d="M900 640l0-52M880 610l20-20 20 20"/>
    <path d="M700 660l0-44M684 638l16-16 16 16"/>
  </g>

  <!-- Jugador flotando -->
  <g transform="translate(760 560)">
    <circle cx="30" cy="24" r="19" fill="#0b0f1e" stroke="#d8d1ff" stroke-width="2.5"/>
    <path d="M14 20a16 16 0 0 1 32 0 16 16 0 0 1-32 0z" fill="#45e0c8" fill-opacity=".28"/>
    <rect x="13" y="46" width="34" height="42" rx="8" fill="#e8e6ff"/>
    <path d="M16 54l-20 12M44 54l20 10" stroke="#e8e6ff" stroke-width="7" stroke-linecap="round"/>
    <path d="M20 86l-8 26M40 86l10 24" stroke="#b9afff" stroke-width="8" stroke-linecap="round"/>
    <rect x="17" y="58" width="26" height="9" rx="3" fill="#8b7bff"/>
  </g>

  <!-- Checkpoint -->
  <g transform="translate(1080 470)">
    <rect x="0" y="0" width="10" height="50" rx="3" fill="#2c3456"/>
    <circle cx="5" cy="-6" r="12" fill="#45e0c8" fill-opacity=".2"/>
    <circle cx="5" cy="-6" r="6" fill="#45e0c8"/>
  </g>

  <!-- HUD -->
  <g font-family="Consolas, monospace">
    <rect x="56" y="52" width="330" height="96" rx="10" fill="#080b16" fill-opacity=".74" stroke="#ffffff" stroke-opacity=".12"/>
    <text x="78" y="80" font-size="12" letter-spacing="3" fill="#a8aec1">GRAVEDAD · 0.32 G</text>
    <rect x="78" y="94" width="286" height="8" rx="4" fill="#ffffff" fill-opacity=".1"/>
    <rect x="78" y="94" width="220" height="8" rx="4" fill="url(#energy)"/>
    <text x="78" y="132" font-size="12" letter-spacing="2" fill="#45e0c8">DASH DISPONIBLE · 1</text>

    <g text-anchor="end">
      <text x="1544" y="74" font-size="12" letter-spacing="3" fill="#a8aec1">SECTOR 03</text>
      <text x="1544" y="102" font-size="24" letter-spacing="2" fill="#f4f5fa">CÁMARA DE FLUJO</text>
      <text x="1544" y="130" font-size="12" letter-spacing="2" fill="#8b7bff">OBJETIVO: ALCANZAR LA SALIDA</text>
    </g>

    <rect x="56" y="800" width="330" height="52" rx="9" fill="#080b16" fill-opacity=".7" stroke="#ffffff" stroke-opacity=".1"/>
    <text x="76" y="822" font-size="11" letter-spacing="2" fill="#767e95">MOVIMIENTO AÉREO</text>
    <text x="76" y="842" font-size="13" letter-spacing="1.5" fill="#a8aec1">A · D    ESPACIO · SALTO    SHIFT · DASH</text>
  </g>

  <rect width="1600" height="900" fill="url(#vignette)" pointer-events="none"/>
  <g opacity=".8">
    <rect x="1304" y="824" width="242" height="36" rx="18" fill="#ffb86b" fill-opacity=".08" stroke="#ffb86b" stroke-opacity=".35"/>
    <text x="1425" y="848" fill="#ffb86b" font-family="Consolas, monospace" font-size="12" letter-spacing="2.5" text-anchor="middle">CAPTURA PROVISIONAL</text>
  </g>
</svg>
