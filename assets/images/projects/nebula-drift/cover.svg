<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title">
  <title id="title">Portada provisional de Nebula Drift</title>
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080b1c"/>
      <stop offset="50%" stop-color="#141236"/>
      <stop offset="100%" stop-color="#2a1a52"/>
    </linearGradient>
    <radialGradient id="planet" cx="36%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#b9aaff"/>
      <stop offset="42%" stop-color="#6d5be0"/>
      <stop offset="100%" stop-color="#241a58"/>
    </radialGradient>
    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b7bff" stop-opacity=".38"/>
      <stop offset="100%" stop-color="#8b7bff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#45e0c8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#45e0c8" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#8b7bff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="titleFade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#05060c" stop-opacity="0"/>
      <stop offset="100%" stop-color="#05060c" stop-opacity=".85"/>
    </linearGradient>
    <filter id="softglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- Estrellas -->
  <g fill="#ffffff">
    <circle cx="140" cy="120" r="2" opacity=".7"/>
    <circle cx="260" cy="230" r="1.5" opacity=".5"/>
    <circle cx="410" cy="96" r="2.5" opacity=".8"/>
    <circle cx="690" cy="160" r="1.5" opacity=".45"/>
    <circle cx="790" cy="70" r="2" opacity=".65"/>
    <circle cx="960" cy="210" r="1.5" opacity=".5"/>
    <circle cx="1180" cy="110" r="2" opacity=".7"/>
    <circle cx="1310" cy="250" r="1.5" opacity=".4"/>
    <circle cx="1490" cy="150" r="2.5" opacity=".7"/>
    <circle cx="540" cy="330" r="1.5" opacity=".35"/>
    <circle cx="220" cy="470" r="2" opacity=".45"/>
    <circle cx="1010" cy="350" r="1.5" opacity=".4"/>
    <circle cx="1420" cy="430" r="2" opacity=".5"/>
    <circle cx="380" cy="640" r="1.5" opacity=".35"/>
    <circle cx="1180" cy="620" r="2" opacity=".4"/>
  </g>

  <!-- Haz de luz -->
  <path d="M-100 780L900 -80l180 0L-100 900z" fill="url(#beam)"/>
  <ellipse cx="1180" cy="680" rx="430" ry="430" fill="url(#aura)" filter="url(#softglow)"/>

  <!-- Planeta -->
  <g>
    <circle cx="1280" cy="720" r="300" fill="url(#planet)"/>
    <circle cx="1280" cy="720" r="300" fill="none" stroke="#d8d1ff" stroke-opacity=".32" stroke-width="2"/>
    <ellipse cx="1280" cy="720" rx="430" ry="86" fill="none" stroke="#a99dff" stroke-opacity=".5" stroke-width="3" transform="rotate(-18 1280 720)"/>
    <ellipse cx="1280" cy="720" rx="470" ry="104" fill="none" stroke="#45e0c8" stroke-opacity=".22" stroke-width="1.5" transform="rotate(-18 1280 720)"/>
    <path d="M1010 690c80 54 180 84 290 84 84 0 162-18 230-50" fill="none" stroke="#ffffff" stroke-opacity=".16" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- Plataforma y astronauta -->
  <g>
    <ellipse cx="560" cy="720" rx="250" ry="30" fill="#05060c" opacity=".55"/>
    <path d="M330 700h460l-58 46H388z" fill="#131a31" stroke="#3b4670" stroke-width="2"/>
    <path d="M348 700h424" stroke="#8b7bff" stroke-width="3" stroke-linecap="round"/>
    <g transform="translate(516 520)">
      <circle cx="44" cy="52" r="40" fill="#0d1120" stroke="#b9afff" stroke-width="3"/>
      <path d="M18 44a27 27 0 0 1 52 0 27 27 0 0 1-52 0z" fill="#8b7bff" fill-opacity=".28" stroke="#d8d1ff" stroke-width="2"/>
      <path d="M28 90h32l12 62H16z" fill="#e8e6ff" fill-opacity=".9"/>
      <path d="M22 96l-26 38M66 96l28 36" stroke="#e8e6ff" stroke-width="9" stroke-linecap="round"/>
      <path d="M27 150l-6 48M61 150l8 48" stroke="#b9afff" stroke-width="10" stroke-linecap="round"/>
      <rect x="30" y="108" width="28" height="18" rx="4" fill="#45e0c8" fill-opacity=".7"/>
    </g>
    <ellipse cx="560" cy="718" rx="150" ry="12" fill="#8b7bff" opacity=".22" filter="url(#softglow)"/>
  </g>

  <!-- Detalles -->
  <g fill="none" stroke="#ffffff" stroke-opacity=".14">
    <path d="M80 80h90M80 80v90M1520 820h-90M1520 820v-90"/>
  </g>
  <g fill="#45e0c8" opacity=".8">
    <circle cx="440" cy="400" r="3"/>
    <circle cx="800" cy="500" r="2"/>
    <circle cx="240" cy="300" r="2"/>
  </g>

  <!-- Badge provisional -->
  <g>
    <rect x="1310" y="54" width="230" height="42" rx="21" fill="#ffb86b" fill-opacity=".1" stroke="#ffb86b" stroke-opacity=".45"/>
    <text x="1425" y="81" fill="#ffb86b" font-family="Consolas, monospace" font-size="14" letter-spacing="3" text-anchor="middle">PROVISIONAL</text>
  </g>

  <!-- Título -->
  <rect y="640" width="1600" height="260" fill="url(#titleFade)"/>
  <rect x="100" y="690" width="70" height="4" rx="2" fill="#8b7bff"/>
  <text x="100" y="785" fill="#f4f5fa" font-family="Arial, Helvetica, sans-serif" font-size="92" font-weight="700" letter-spacing="-3">Nebula Drift</text>
  <text x="102" y="826" fill="#a8aec1" font-family="Consolas, monospace" font-size="17" letter-spacing="4">PLATAFORMAS 2D · PROTOTIPO</text>
</svg>
