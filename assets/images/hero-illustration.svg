<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 760" width="760" height="760" role="img" aria-labelledby="title">
  <title id="title">Ilustración abstracta de un mando de videojuegos con anillos orbitales</title>
  <defs>
    <radialGradient id="glow" cx="50%" cy="48%" r="50%">
      <stop offset="0%" stop-color="#8b7bff" stop-opacity=".55"/>
      <stop offset="55%" stop-color="#5a4bd6" stop-opacity=".16"/>
      <stop offset="100%" stop-color="#8b7bff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#232943"/>
      <stop offset="100%" stop-color="#10131f"/>
    </linearGradient>
    <linearGradient id="edge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b7acff"/>
      <stop offset="50%" stop-color="#7f6cff"/>
      <stop offset="100%" stop-color="#45e0c8"/>
    </linearGradient>
    <linearGradient id="dpad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e9e6ff"/>
      <stop offset="100%" stop-color="#9f93ff"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="tiny" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>

  <!-- Halo -->
  <circle cx="380" cy="378" r="300" fill="url(#glow)"/>
  <circle cx="380" cy="378" r="250" fill="none" stroke="#ffffff" stroke-opacity=".055"/>
  <circle cx="380" cy="378" r="196" fill="none" stroke="#ffffff" stroke-opacity=".09" stroke-dasharray="2 8"/>
  <circle cx="380" cy="378" r="330" fill="none" stroke="#8b7bff" stroke-opacity=".15" stroke-dasharray="1 14"/>

  <!-- Satélites -->
  <g opacity=".9">
    <circle cx="380" cy="78" r="4.5" fill="#45e0c8"/>
    <circle cx="676" cy="330" r="3" fill="#8b7bff"/>
    <circle cx="120" cy="470" r="3.5" fill="#ffb86b"/>
    <circle cx="612" cy="636" r="2.5" fill="#f4f5fa" opacity=".6"/>
  </g>

  <!-- Formas flotantes -->
  <g fill="none" stroke="#45e0c8" stroke-opacity=".5">
    <path d="M138 226l26-30 30 25-26 30z"/>
    <path d="M592 178l16-18 18 15-16 18z" stroke="#ffb86b" stroke-opacity=".55"/>
  </g>
  <g fill="#8b7bff" fill-opacity=".22">
    <path d="M108 566l34 14-34 14-6-14z"/>
    <path d="M628 470l24 10-24 10-5-10z" fill="#45e0c8"/>
  </g>

  <!-- Sombra del mando -->
  <ellipse cx="380" cy="560" rx="190" ry="26" fill="#05060a" opacity=".7" filter="url(#soft)"/>

  <!-- Mando -->
  <g>
    <!-- Botones superiores -->
    <path d="M258 318h58l-8-26h-42z" fill="#1a1e2e" stroke="#3d4462" stroke-width="2"/>
    <path d="M444 318h58l8-26h-42z" fill="#1a1e2e" stroke="#3d4462" stroke-width="2"/>

    <!-- Cuerpo -->
    <path d="M262 328h236c44 0 72 28 82 78l22 90c10 43-22 74-61 54l-79-41H294l-79 41c-39 20-71-11-61-54l22-90c10-50 38-78 86-78z"
      fill="url(#body)" stroke="url(#edge)" stroke-width="3"/>

    <!-- Brillo interior -->
    <path d="M276 344h208c30 0 50 18 58 56l7 30c-34-24-72-34-114-34h-116c-42 0-80 10-114 34l7-30c8-38 28-56 64-56z"
      fill="#ffffff" fill-opacity=".035"/>

    <!-- Cruceta -->
    <g fill="url(#dpad)">
      <rect x="288" y="396" width="78" height="22" rx="7"/>
      <rect x="316" y="368" width="22" height="78" rx="7"/>
    </g>

    <!-- Botones de acción -->
    <g>
      <circle cx="514" cy="386" r="14" fill="#ffb86b"/>
      <circle cx="544" cy="416" r="14" fill="#45e0c8"/>
      <circle cx="484" cy="416" r="14" fill="#8b7bff"/>
      <circle cx="514" cy="446" r="14" fill="#f4f5fa"/>
      <circle cx="514" cy="386" r="14" fill="none" stroke="#ffffff" stroke-opacity=".28"/>
      <circle cx="544" cy="416" r="14" fill="none" stroke="#ffffff" stroke-opacity=".28"/>
      <circle cx="484" cy="416" r="14" fill="none" stroke="#ffffff" stroke-opacity=".28"/>
      <circle cx="514" cy="446" r="14" fill="none" stroke="#ffffff" stroke-opacity=".28"/>
    </g>

    <!-- Centro -->
    <g>
      <circle cx="380" cy="414" r="25" fill="#0b0e18" stroke="#3d4462" stroke-width="2"/>
      <path d="M380 400l12 7v14l-12 7-12-7v-14z" fill="none" stroke="#8b7bff" stroke-width="2.5"/>
      <circle cx="380" cy="414" r="3" fill="#45e0c8"/>
    </g>

    <!-- Puertos y detalles -->
    <rect x="346" y="479" width="68" height="6" rx="3" fill="#0a0c14" stroke="#333a55"/>
    <circle cx="258" cy="453" r="5" fill="#0a0c14" stroke="#333a55"/>
    <circle cx="502" cy="453" r="5" fill="#0a0c14" stroke="#333a55"/>
  </g>

  <!-- Chispas -->
  <g fill="#ffffff">
    <circle cx="226" cy="300" r="2" opacity=".7"/>
    <circle cx="556" cy="300" r="2" opacity=".55"/>
    <circle cx="622" cy="556" r="2.5" opacity=".45"/>
    <circle cx="156" cy="382" r="2" opacity=".5"/>
  </g>
</svg>
